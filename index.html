<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | Premium Luxury Beauty & Aesthetics</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@200;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --primary: #1a1a1a;
            --accent: #d4af37; /* Luxury Gold */
            --bg-light: #faf7f2; /* Soft Cream */
            --bg-white: #ffffff;
            --text-dark: #2c2c2c;
            --text-muted: #666666;
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Montserrat', sans-serif;
            --transition: all 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-dark);
            background-color: var(--bg-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* TYPOGRAPHY OVERRIDES */
        h1, h2, h3, h4, .brand-logo {
            font-family: var(--font-serif);
            font-weight: 400;
            letter-spacing: 1px;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* REUSABLE UTILITIES */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .section-padding {
            padding: 100px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header span {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            display: block;
            margin-bottom: 10px;
        }

        .section-header h2 {
            font-size: 3rem;
            color: var(--primary);
        }

        .btn {
            display: inline-block;
            padding: 14px 34px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: var(--primary);
            transition: var(--transition);
            z-index: -1;
        }

        .btn:hover::before {
            width: 100%;
        }

        .btn:hover {
            color: var(--bg-white);
        }

        .btn-accent {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-accent::before {
            background: var(--accent);
        }

        .btn-accent:hover {
            color: var(--primary);
        }

        /* TOP ANNOUNCEMENT BAR */
        .announcement-bar {
            background-color: var(--primary);
            color: var(--bg-light);
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            padding: 10px 0;
            text-transform: uppercase;
        }

        /* HEADER & NAVIGATION */
        header {
            background-color: var(--bg-white);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.02);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 90px;
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 4px;
        }

        .brand-logo span {
            color: var(--accent);
        }

        .nav-menu {
            display: flex;
            gap: 35px;
        }

        .nav-link {
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            padding: 5px 0;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--accent);
            transition: var(--transition);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-utilities {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 1.1rem;
        }

        .nav-utilities i {
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-utilities i:hover {
            color: var(--accent);
        }

        /* HERO SECTION */
        .hero {
            height: calc(100vh - 125px);
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            display: flex;
            align-items: center;
            color: var(--bg-white);
            position: relative;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent);
            margin-bottom: 20px;
            display: block;
        }

        .hero-title {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .hero-description {
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        /* BRAND PHILOSOPHY / ABOUT CONCEPT */
        .philosophy {
            background-color: var(--bg-light);
        }

        .philosophy-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .philosophy-images {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            position: relative;
        }

        .phil-img-main {
            grid-column: 1 / 10;
            z-index: 2;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        .phil-img-sub {
            grid-column: 7 / -1;
            margin-top: 150px;
            z-index: 1;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 10px solid var(--bg-white);
        }

        .philosophy-text span {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .philosophy-text h3 {
            font-size: 2.8rem;
            margin: 15px 0 25px;
            line-height: 1.2;
        }

        .philosophy-text p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        /* SIGNATURE SERVICES SECTION */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .service-card {
            background: var(--bg-white);
            border: 1px solid rgba(0,0,0,0.03);
            overflow: hidden;
            transition: var(--transition);
        }

        .service-img-wrapper {
            overflow: hidden;
            position: relative;
            height: 380px;
        }

        .service-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .service-card:hover .service-img-wrapper img {
            transform: scale(1.08);
        }

        .service-info {
            padding: 30px;
            text-align: center;
        }

        .service-info h3 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            transition: var(--transition);
        }

        .service-info h3:hover {
            color: var(--accent);
        }

        .service-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .service-link {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 4px;
        }

        /* E-COMMERCE / PRODUCTS SECTION */
        .products {
            background-color: var(--bg-light);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .product-card {
